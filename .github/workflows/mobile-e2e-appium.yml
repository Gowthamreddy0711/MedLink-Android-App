name: MedLink Mobile E2E Automation (Appium)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mobile-e2e:
    name: Appium End-to-End Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: automation/mobile/package.json

    - name: Install Appium & Drivers
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Install Automation Dependencies
      working-directory: automation/mobile
      run: npm install

    - name: Generate E2E Analysis Report (500 Test Cases)
      working-directory: automation/mobile
      run: npm run generate-report

    - name: Upload Excel Analysis
      uses: actions/upload-artifact@v4
      with:
        name: MedLink_Mobile_E2E_Analysis
        path: automation/mobile/MedLink_Mobile_E2E_Report.xlsx
